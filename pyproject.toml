[project]
name = "spine-cli"
version = "0.1.1"
description = "Harness-agnostic process spine CLI"
readme = "spec.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "ASabale" }]
dependencies = ["pyyaml>=6"]

[project.scripts]
spine = "spine.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spine"]


[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
